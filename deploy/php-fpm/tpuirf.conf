[tpuirf]
user = ubuntu
group = ubuntu

listen = /run/php/php8.4-fpm-tpuirf.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
request_terminate_timeout = 60s

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/ubuntu/tpuirf-platform/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M

; Laravel reads application settings from the project .env file.
