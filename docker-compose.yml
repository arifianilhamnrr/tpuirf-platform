services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: tpuirf_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - APP_NAME=TPUIRF
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:SI7i7Zjc/c5/ZqhXZ2vyVTYZjdYqsf2YkYE3sohboKM=
      - APP_URL=https://tpuirf.projectar.web.id
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/data/database.sqlite
      - DB_BUSY_TIMEOUT=15000
      - DB_JOURNAL_MODE=WAL
      - DB_SYNCHRONOUS=NORMAL
      - DB_TRANSACTION_MODE=IMMEDIATE
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
      - CACHE_STORE=file
      - ML_SERVICE_URL=http://ml:5000
      - GOOGLE_SHEETS_WEBHOOK_URL=https://script.google.com/macros/s/AKfycbxLB-B-iW1Wlri4imCrGQrEEO99XAAsX2ye2d061uSWAvtiCPDZQ1-LgI6QT0xsZiks/exec
      - GOOGLE_SHEETS_XAI_WEBHOOK_URL=https://script.google.com/macros/s/AKfycbxCep5cKbGO0FeLhKwSONoNXXbl-FwRbVlPikW4Hiw4mnWNR2sLAlKtDKN6EGMsYa1v/exec
    volumes:
      - tpuirf_storage:/var/www/html/storage
      - tpuirf_db:/var/www/html/database/data
    depends_on:
      - ml

  ml:
    build:
      context: ./python
      dockerfile: ../deploy/docker/Dockerfile.ml
    container_name: tpuirf_ml
    restart: unless-stopped
    volumes:
      - tpuirf_storage:/var/www/html/storage
      - tpuirf_ml_models:/app/models

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tpuirf_tunnel
    restart: unless-stopped
    command: tunnel --protocol http2 --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  tpuirf_storage:
  tpuirf_db:
  tpuirf_ml_models:
